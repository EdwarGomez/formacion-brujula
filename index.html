<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Formación Brújula IA · Grupo LEMCO</title>
    <!-- Stlite CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.1/build/stlite.css" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0F172A;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      #root {
        width: 100%;
        height: 100vh;
      }
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0F172A;
        color: #F8FAFC;
        z-index: 99999;
        text-align: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      .spinner {
        width: 52px;
        height: 52px;
        border: 4px solid #334155;
        border-top-color: #0284C7;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 1.5rem;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .badge-brand {
        display: inline-block;
        padding: 0.35rem 0.85rem;
        background: rgba(2, 132, 199, 0.18);
        border: 1px solid rgba(2, 132, 199, 0.4);
        border-radius: 9999px;
        color: #38BDF8;
        font-size: 0.8rem;
        font-weight: 600;
        margin-bottom: 1rem;
      }
      h2 {
        margin: 0 0 0.5rem 0;
        font-size: 1.4rem;
        font-weight: 700;
        color: #F8FAFC;
      }
      p {
        margin: 0;
        font-size: 0.95rem;
        color: #94A3B8;
        max-width: 480px;
        line-height: 1.5;
      }
      #status-msg {
        margin-top: 1.25rem;
        font-family: monospace;
        font-size: 0.85rem;
        color: #CBD5E1;
        background: rgba(15, 23, 42, 0.8);
        padding: 0.4rem 0.8rem;
        border-radius: 6px;
        border: 1px solid #334155;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <span class="badge-brand">Grupo LEMCO · Proyecto Brújula IA</span>
      <div class="spinner"></div>
      <h2>Iniciando Formación Interactiva</h2>
      <p>Cargando el entorno de ejecución en tu navegador con WebAssembly. La primera carga puede tomar unos segundos mientras se descargan las librerías analíticas.</p>
      <div id="status-msg">Descargando código de la aplicación...</div>
    </div>

    <div id="root"></div>

    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.1/build/stlite.js";

      const statusEl = document.getElementById("status-msg");

      try {
        if (statusEl) statusEl.textContent = "Obteniendo app_presentacion_ia.py...";
        const response = await fetch("./app_presentacion_ia.py");
        if (!response.ok) {
          throw new Error(`Error al cargar el archivo de la aplicación (${response.status} ${response.statusText})`);
        }
        const pyCode = await response.text();

        if (statusEl) statusEl.textContent = "Iniciando motor Python y librerías (pandas, plotly)...";

        await mount(
          {
            requirements: ["pandas", "plotly"],
            entrypoint: "app_presentacion_ia.py",
            files: {
              "app_presentacion_ia.py": pyCode
            }
          },
          document.getElementById("root")
        );

        // Ocultar pantalla de carga
        const loader = document.getElementById("loading-screen");
        if (loader) {
          loader.style.transition = "opacity 0.4s ease";
          loader.style.opacity = "0";
          setTimeout(() => loader.remove(), 400);
        }
      } catch (err) {
        console.error(err);
        if (statusEl) {
          statusEl.style.color = "#F87171";
          statusEl.style.borderColor = "#EF4444";
          statusEl.textContent = `Error: ${err.message}`;
        }
      }
    </script>
  </body>
</html>
